<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60" role="img" aria-label="MLB Logo">
  <!-- MLB silhouette batter logo (stylized representation) -->
  <rect width="120" height="60" rx="4" fill="#002D72"/>
  <!-- "MLB" wordmark in white -->
  <text x="60" y="40" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="28" fill="white" text-anchor="middle" letter-spacing="2">MLB</text>
  <!-- Red accent bar -->
  <rect x="10" y="50" width="100" height="3" rx="1.5" fill="#D50032"/>
</svg>
